<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#14213d"/></linearGradient>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f87171"/></marker>
  </defs>
  <rect width="900" height="330" rx="20" fill="url(#bg2)"/>
  <text x="450" y="42" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">Ride Lifecycle State Machine</text>
  <text x="450" y="64" text-anchor="middle" fill="#94a3b8" font-size="13">Controlled transitions · atomic driver assignment</text>

  <g font-size="12.5" font-weight="700" text-anchor="middle" fill="#fff">
    <rect x="20"  y="110" width="118" height="46" rx="23" fill="#334155"/><text x="79"  y="138">requested</text>
    <rect x="160" y="110" width="118" height="46" rx="23" fill="#0369a1"/><text x="219" y="138">searching</text>
    <rect x="300" y="110" width="132" height="46" rx="23" fill="#6d28d9"/><text x="366" y="138">driver_assigned</text>
    <rect x="454" y="110" width="132" height="46" rx="23" fill="#b45309"/><text x="520" y="138">driver_arriving</text>
    <rect x="608" y="110" width="118" height="46" rx="23" fill="#047857"/><text x="667" y="138">started</text>
    <rect x="748" y="110" width="132" height="46" rx="23" fill="#16a34a"/><text x="814" y="138">completed ✓</text>
  </g>
  <g stroke="#94a3b8" stroke-width="2" marker-end="url(#a2)">
    <line x1="138" y1="133" x2="158" y2="133"/><line x1="278" y1="133" x2="298" y2="133"/>
    <line x1="432" y1="133" x2="452" y2="133"/><line x1="586" y1="133" x2="606" y2="133"/><line x1="726" y1="133" x2="746" y2="133"/>
  </g>

  <!-- Accept note -->
  <path d="M219 108 C219 80 366 80 366 108" stroke="#a78bfa" stroke-width="2" fill="none" marker-end="url(#a2)"/>
  <text x="292" y="84" text-anchor="middle" fill="#c4b5fd" font-size="11">atomic accept (status = searching, no driver yet)</text>

  <!-- Cancelled -->
  <rect x="300" y="215" width="118" height="42" rx="21" fill="#7f1d1d" stroke="#f87171" stroke-width="1.5"/>
  <text x="359" y="241" text-anchor="middle" fill="#fecaca" font-size="12.5" font-weight="700">cancelled</text>
  <path d="M79 158 C79 236 200 236 298 236" stroke="#f87171" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#a3)"/>
  <path d="M219 158 L240 200 L300 226" stroke="#f87171" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#a3)"/>
  <path d="M366 158 L366 213" stroke="#f87171" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#a3)"/>
  <text x="359" y="280" text-anchor="middle" fill="#94a3b8" font-size="11">when the current state permits</text>

  <!-- Driver availability -->
  <rect x="560" y="205" width="320" height="64" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="720" y="230" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="700" letter-spacing="1">DRIVER AVAILABILITY</text>
  <text x="720" y="253" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="600">online  →  busy  →  online</text>
</svg>
