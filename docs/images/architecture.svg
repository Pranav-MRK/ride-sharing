<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#14213d"/></linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="900" height="540" rx="20" fill="url(#bg)"/>
  <text x="450" y="42" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">RideShare Backend Architecture</text>
  <text x="450" y="64" text-anchor="middle" fill="#94a3b8" font-size="13">Layered REST API with a separate real-time Socket.io channel</text>

  <!-- REST column -->
  <text x="230" y="102" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1.5">REST API FLOW</text>
  <g font-size="14" font-weight="600" text-anchor="middle" fill="#f8fafc">
    <rect x="90" y="115" width="280" height="44" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><text x="230" y="143">Client / Postman</text>
    <rect x="90" y="185" width="280" height="44" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2"/><text x="230" y="213">Express Routes</text>
    <rect x="90" y="255" width="280" height="54" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/><text x="230" y="278" fill="#fbbf24">Middleware</text><text x="230" y="297" font-size="11" font-weight="400" fill="#94a3b8">JWT auth · Joi validation</text>
    <rect x="90" y="335" width="280" height="44" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2"/><text x="230" y="363">Controllers</text>
    <rect x="90" y="405" width="280" height="54" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/><text x="230" y="428" fill="#c4b5fd">Services</text><text x="230" y="447" font-size="11" font-weight="400" fill="#94a3b8">Business logic · ride state machine</text>
  </g>
  <g stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)">
    <line x1="230" y1="159" x2="230" y2="183"/><line x1="230" y1="229" x2="230" y2="253"/>
    <line x1="230" y1="309" x2="230" y2="333"/><line x1="230" y1="379" x2="230" y2="403"/>
  </g>

  <!-- Socket column -->
  <text x="670" y="102" text-anchor="middle" fill="#34d399" font-size="12" font-weight="700" letter-spacing="1.5">REAL-TIME FLOW</text>
  <g font-size="14" font-weight="600" text-anchor="middle" fill="#f8fafc">
    <rect x="530" y="115" width="280" height="44" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="2"/><text x="670" y="143">Driver Client</text>
    <rect x="530" y="185" width="280" height="54" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="2"/><text x="670" y="208" fill="#6ee7b7">Socket.io Server</text><text x="670" y="227" font-size="11" font-weight="400" fill="#94a3b8">JWT handshake · driver:location:update</text>
  </g>
  <g stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"><line x1="670" y1="159" x2="670" y2="183"/></g>
  <path d="M670 239 L670 380 L372 432" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#ar)" stroke-dasharray="5 4"/>
  <text x="690" y="318" fill="#64748b" font-size="11">validated coordinates</text>

  <!-- Shared bottom -->
  <g font-size="14" font-weight="600" text-anchor="middle" fill="#f8fafc">
    <rect x="250" y="478" width="400" height="46" rx="10" fill="#1e293b" stroke="#f472b6" stroke-width="2"/>
    <text x="450" y="499" fill="#f9a8d4">Repositories → MongoDB</text><text x="450" y="515" font-size="11" font-weight="400" fill="#94a3b8">Mongoose · GeoJSON · 2dsphere index</text>
  </g>
  <g stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"><line x1="230" y1="459" x2="330" y2="476"/></g>
</svg>
